  <body>
    <!-- Splash screen inline: visible apenas abre la PWA, antes de que React monte. -->
    <!-- Se oculta automáticamente cuando React renderiza el primer contenido. -->
    <div id="app-splash" aria-hidden="true">
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          z-index: 999999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2rem;
          background: hsl(180 12% 16%);
          transition: opacity 0.4s ease-out;
        }
        #app-splash.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        #app-splash .splash-logo-wrap {
          padding: 1rem;
          border-radius: 9999px;
          background: hsl(180 12% 8%);
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          animation:
            splashLogoEntrance 0.6s ease-out forwards,
            splashGlowPulse 2s ease-in-out 0.6s infinite;
        }
        #app-splash .splash-logo-wrap img {
          width: 80px;
          height: 80px;
          object-fit: contain;
          display: block;
          border-radius: 9999px;
        }
        #app-splash .splash-dots {
          display: flex;
          gap: 0.5rem;
          align-items: center;
        }
        #app-splash .splash-dots span {
          width: 8px;
          height: 8px;
          border-radius: 9999px;
          background: #00a5a0;
          animation: splashDotBounce 1.4s ease-in-out infinite;
        }
        #app-splash .splash-dots span:nth-child(1) { animation-delay: 0ms; }
        #app-splash .splash-dots span:nth-child(2) { animation-delay: 150ms; }
        #app-splash .splash-dots span:nth-child(3) { animation-delay: 300ms; }

        @keyframes splashLogoEntrance {
          from { opacity: 0; transform: translateY(20px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes splashGlowPulse {
          0%, 100% { box-shadow: 0 0 0 0 hsl(180 12% 8% / 0); }
          50%      { box-shadow: 0 0 0 0 hsl(180 12% 8% / 0); }
        }
        @keyframes splashDotBounce {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40%           { opacity: 1;   transform: scale(1.2); }
        }
      </style>
      <div class="splash-logo-wrap">
        <img src="/app-icon-512.png" alt="Cargando..." />
      </div>
      <div class="splash-dots" role="status" aria-label="Cargando">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
