<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Sistema de gestión de consultorios con agenda inteligente, pacientes y pagos. Tu consultorio digital bien gestionado." />
    <meta name="author" content="Tu Consultorio Digital" />
    <meta name="google-site-verification" content="ELTsOpAgouTXLfTrdNxBmfLTs1FV6MJReSEzsQxU43I" />

    <meta property="og:title" content="Consultorio Digital — Agenda y WhatsApp automáticos" />
    <meta property="og:description" content="Sistema de gestión para profesionales de la salud: turnos, recordatorios por WhatsApp y cobros con Mercado Pago." />
    <meta property="og:image" content="https://consultoriodigital.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://consultoriodigital.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://consultoriodigital.app/og-image.png" />

    <!-- Datos estructurados del sitio (marca + búsqueda) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Consultorio Digital",
        "url": "https://consultoriodigital.app",
        "logo": "https://consultoriodigital.app/favicon.png",
        "description": "Sistema de gestión de consultorios con agenda inteligente, pacientes y pagos.",
        "areaServed": "UY"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Consultorio Digital",
        "url": "https://consultoriodigital.app",
        "inLanguage": "es-UY"
      }
    </script>
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Tu Consultorio" />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Google Fonts - Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Prefetch DNS for faster external resource loading -->
    <link rel="dns-prefetch" href="https://sfvuuzpmsgepooeamkin.supabase.co" />
    
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://sfvuuzpmsgepooeamkin.supabase.co" crossorigin />

    <!-- Theme bootstrap: aplica el tema guardado antes del primer paint.
         El modo OSCURO es el default; el claro solo si la persona lo eligió. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-preference');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Splash screen inline: visible apenas abre la PWA, antes de que React monte. -->
    <!-- Se oculta automáticamente cuando React renderiza el primer contenido. -->
    <div id="app-splash" aria-hidden="true">
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          z-index: 999999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2rem;
          background: hsl(180 12% 16%);
          transition: opacity 0.4s ease-out;
        }
        #app-splash.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        #app-splash .splash-logo-wrap {
          width: 124px;
          height: 124px;
          border-radius: 9999px;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background: hsl(180 12% 8%);
          animation: splashLogoEntrance 0.6s ease-out forwards;
        }
        #app-splash .splash-logo-wrap img {
          width: 74px;
          height: 74px;
          object-fit: contain;
          display: block;
        }
        #app-splash .splash-dots {
          display: flex;
          gap: 0.5rem;
          align-items: center;
        }
        #app-splash .splash-dots span {
          width: 8px;
          height: 8px;
          border-radius: 9999px;
          background: #00a5a0;
          animation: splashDotBounce 1.4s ease-in-out infinite;
        }
        #app-splash .splash-dots span:nth-child(1) { animation-delay: 0ms; }
        #app-splash .splash-dots span:nth-child(2) { animation-delay: 150ms; }
        #app-splash .splash-dots span:nth-child(3) { animation-delay: 300ms; }

        @keyframes splashLogoEntrance {
          from { opacity: 0; transform: translateY(20px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes splashDotBounce {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40%           { opacity: 1;   transform: scale(1.2); }
        }
      </style>
      <div class="splash-logo-wrap">
        <img src="/logo-loading.png" alt="Cargando..." />
      </div>
      <div class="splash-dots" role="status" aria-label="Cargando">
        <span></span><span></span><span></span>
      </div>
      <!-- Vigilante del splash: si la app no arrancó en 12s (bundle viejo,
           caché rota, red), ofrece recargar limpiando cachés. Vive en el HTML
           para funcionar aunque el JavaScript de la app nunca ejecute. -->
      <div id="splash-stuck" style="display:none;flex-direction:column;align-items:center;gap:12px;">
        <p style="margin:0;font-family:system-ui,sans-serif;font-size:14px;color:rgba(255,255,255,0.55);">Está tardando más de lo normal.</p>
        <button
          onclick="(async function(){try{if('caches' in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister()}))}}catch(e){}location.reload()})()"
          style="height:44px;padding:0 24px;border:none;border-radius:12px;background:rgba(255,255,255,0.12);color:#fff;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;cursor:pointer;"
        >Recargar página</button>
      </div>
      <script>
        setTimeout(function () {
          var s = document.getElementById('app-splash');
          var b = document.getElementById('splash-stuck');
          if (s && b) b.style.display = 'flex';
        }, 12000);
      </script>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
